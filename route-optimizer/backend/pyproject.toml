[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "route-optimizer-backend"
version = "0.1.0"
description = "Local-first route optimization API"
requires-python = ">=3.9"
dependencies = [
  "fastapi==0.115.2",
  "uvicorn==0.30.6",
  "httpx==0.27.2",
  "pydantic==2.9.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=app --cov-branch --cov-report=term-missing --cov-fail-under=85"
